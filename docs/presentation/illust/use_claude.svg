="middle">1</text><text x="316" y="174" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="24" font-weight="800" fill="#D85A30" text-anchor="start" dominant-baseline="middle">Code 탭</text><rect x="490" y="150" width="520" height="60" rx="10" fill="#fff" stroke="#9AA09C" stroke-width="2"/><path d="M510 172 q0 -10 10 -10 h13.799999999999999 l10 10 h12.199999999999996 q10 0 10 10 v23.119999999999997 q0 10 -10 10 h-36 q-10 0 -10 -10 z" fill="#7FB7A4"/><text x="533.0" y="221.12" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="19" font-weight="700" fill="#1F2421" text-anchor="middle" dominant-baseline="middle"></text><text x="574" y="180" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="22" font-weight="700" fill="#1F2421" text-anchor="start" dominant-baseline="middle">가우도 사진 (사진이 있는 폴더)</text><rect x="480" y="142" width="540" height="76" rx="38.0" fill="none" stroke="#D85A30" stroke-width="4.5"/><circle cx="1056" cy="180" r="22" fill="#D85A30"/><text x="1056" y="181" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="25" font-weight="800" fill="#fff" text-anchor="middle" dominant-baseline="middle">2</text><text x="1086" y="180" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="24" font-weight="800" fill="#D85A30" text-anchor="start" dominant-baseline="middle">작업 폴더 = 사진 폴더 선택</text><rect x="420" y="260" width="1260" height="150" rx="12" fill="#F4F6F5" stroke="none" stroke-width="2"/><text x="450" y="300" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="19" font-weight="800" fill="#0F6E56" text-anchor="start" dominant-baseline="middle">Claude</text><text x="450" y="340" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="21" font-weight="500" fill="#5C625E" text-anchor="start" dominant-baseline="middle">사진 7장 확인 · 찾은 정보 정리 → A 확인: 사진 순서 · 표지 문구 · 캡션</text><text x="450" y="378" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="19" font-weight="500" fill="#8A8F8B" text-anchor="start" dominant-baseline="middle">(이후 B 대본 · C 블로그 · D 대표 승인 · E 링크 순서로 물어봄)</text><rect x="420" y="450" width="1260" height="100" rx="16" fill="#fff" stroke="#0F6E56" stroke-width="3"/><text x="450" y="500" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="28" font-weight="800" fill="#1F2421" text-anchor="start" dominant-baseline="middle">이 사진으로 여행 콘텐츠 만들어줘. 장소는 가우도</text><circle cx="1630" cy="500" r="26" fill="#0F6E56"/><path d="M1630 512 v-22 M1620 499 l10 -10 l10 10" fill="none" stroke="#fff" stroke-width="4"/><circle cx="1100" cy="450" r="22" fill="#D85A30"/><text x="1100" y="451" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="25" font-weight="800" fill="#fff" text-anchor="middle" dominant-baseline="middle">3</text><text x="1130" y="432" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="24" font-weight="800" fill="#D85A30" text-anchor="start" dominant-baseline="middle">한 문장 입력 → 보내기</text><text x="1730" y="625" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="16" font-weight="500" fill="#8A8F8B" text-anchor="end" dominant-baseline="middle">예시 그림 · 앱 화면을 단순화한 그림 (실제 배치와 다를 수 있음)</text></svg>